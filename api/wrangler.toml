# MYCELA search API. Local development only for now (Phase 1): nothing in
# this file has been deployed. See api/README.md.
name = "mycela-search-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
# No anonymous usage telemetry from wrangler to Cloudflare.
send_metrics = false

# The published catalogue. For `wrangler dev` this is a local, on-disk store
# in admin/.wrangler/state, shared with the admin Worker (`npm run dev` here
# points at it; filled by a local publish or scripts/build-published.js).
# This Worker has no database binding and must never get one. The id below is
# only a placeholder and must be replaced with the real namespace id when
# the Worker is first deployed.
[[kv_namespaces]]
binding = "CATALOG"
id = "local-placeholder-replace-before-deploy"

# Per-visitor rate limit on /search: 60 requests per minute per IP
# (CF-Connecting-IP). /health is not limited. Cloudflare counts per data
# centre and the count is approximate, so a visitor may get a few more
# before the 429s start. namespace_id is any number unique to this limiter
# within the account. wrangler dev and the tests simulate it locally.
[[ratelimits]]
name = "SEARCH_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
